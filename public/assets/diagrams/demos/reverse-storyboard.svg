<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
  <title id="title">Reverse Storyboard 처리 파이프라인</title>
  <desc id="desc">로컬 비디오를 검증하고 분석 범위를 제한한 뒤 샷 탐지와 대표 프레임 선택을 수행하고, 사용자 검토를 거쳐 프레임과 메타데이터 ZIP을 제공하는 흐름</desc>
  <defs>
    <style>
      .display { font-family: Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: -1.8px; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .body { font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .mono { font-family: Courier, monospace; font-weight: 700; letter-spacing: 0.35px; }
    </style>
  </defs>

  <rect width="1400" height="580" fill="#f4e9e1"/>

  <text x="48" y="38" class="mono" font-size="13" fill="#0e0e0e">REVERSE STORYBOARD / BOUNDED REVIEW PIPELINE</text>
  <text x="48" y="108" class="display" font-size="50" fill="#0e0e0e">VIDEO SEQUENCE</text>
  <line x1="540" y1="86" x2="564" y2="86" stroke="#ff3d00" stroke-width="5"/>
  <text x="628" y="108" class="display" font-size="50" fill="#ff3d00">STORYBOARD FRAMES</text>

  <g aria-label="비디오에서 스토리보드 프레임으로 변환">
    <rect x="1270" y="38" width="72" height="42" rx="6" fill="#2835f8"/>
    <rect x="1354" y="26" width="30" height="54" rx="6" fill="#ff3d00"/>
  </g>

  <line x1="270" y1="318" x2="294" y2="318" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="504" y1="318" x2="528" y2="318" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="778" y1="318" x2="802" y2="318" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="1062" y1="318" x2="1086" y2="318" stroke="#0e0e0e" stroke-width="3"/>

  <g aria-label="1단계 로컬 비디오 입력 검증">
    <rect x="48" y="166" width="222" height="304" rx="16" fill="#2835f8"/>
    <text x="72" y="200" class="mono" font-size="13" fill="#ffffff">01 / INPUT</text>
    <text x="72" y="254" class="heading" font-size="29" fill="#ffffff">UPLOAD</text>
    <text x="72" y="288" class="heading" font-size="29" fill="#ffffff">&amp; PROBE</text>
    <path d="M72 316H246" stroke="#ffffff" stroke-width="2"/>
    <text x="72" y="350" class="body" font-size="14" fill="#ffffff">ONE LOCAL VIDEO</text>
    <text x="72" y="382" class="mono" font-size="10.5" fill="#f4e9e1">STREAM + DURATION</text>
    <text x="72" y="402" class="mono" font-size="10.5" fill="#f4e9e1">SIZE + FPS + FORMAT</text>
    <text x="72" y="444" class="mono" font-size="11" fill="#f4e9e1">FFPROBE</text>
  </g>

  <g aria-label="2단계 사용자 옵션과 처리량 경계">
    <rect x="294" y="166" width="210" height="304" rx="16" fill="#ffff00"/>
    <text x="318" y="200" class="mono" font-size="12" fill="#0e0e0e">02 / USER GATE</text>
    <text x="318" y="254" class="heading" font-size="28" fill="#0e0e0e">BOUND</text>
    <text x="318" y="288" class="heading" font-size="28" fill="#0e0e0e">THE RUN</text>
    <path d="M318 316H480" stroke="#0e0e0e" stroke-width="2"/>
    <text x="318" y="350" class="body" font-size="13.5" fill="#0e0e0e">WINDOW + PRESET</text>
    <text x="318" y="382" class="mono" font-size="10.5" fill="#0e0e0e">MAX 30S + 40 SHOTS</text>
    <text x="318" y="402" class="mono" font-size="10.5" fill="#0e0e0e">CLIPS: OPT-IN</text>
    <text x="318" y="444" class="mono" font-size="10.5" fill="#0e0e0e">COPY FAILS: ENCODE</text>
  </g>

  <g aria-label="3단계 샷 탐지">
    <rect x="528" y="166" width="250" height="304" rx="16" fill="#5900cc"/>
    <text x="552" y="200" class="mono" font-size="13" fill="#ffffff">03 / CORE</text>
    <text x="552" y="254" class="heading" font-size="29" fill="#ffffff">DETECT</text>
    <text x="552" y="288" class="heading" font-size="29" fill="#ffffff">THE SHOTS</text>
    <path d="M552 316H754" stroke="#ffffff" stroke-width="2"/>
    <text x="552" y="350" class="body" font-size="14" fill="#ffffff">ADAPTIVE CUTS</text>
    <text x="552" y="382" class="mono" font-size="10.5" fill="#f4e9e1">NO CUT: ONE SHOT</text>
    <text x="552" y="402" class="mono" font-size="10.5" fill="#f4e9e1">THREE PRESETS</text>
    <text x="552" y="444" class="mono" font-size="11" fill="#f4e9e1">PYSCENEDETECT</text>
  </g>

  <g aria-label="4단계 대표 프레임 선택과 fallback">
    <rect x="802" y="166" width="260" height="304" rx="16" fill="#ff3d00"/>
    <text x="826" y="200" class="mono" font-size="12" fill="#0e0e0e">04 / FALLBACK</text>
    <text x="826" y="254" class="heading" font-size="29" fill="#0e0e0e">PICK</text>
    <text x="826" y="288" class="heading" font-size="29" fill="#0e0e0e">THE FRAME</text>
    <path d="M826 316H1038" stroke="#0e0e0e" stroke-width="2"/>
    <text x="826" y="350" class="body" font-size="14" fill="#0e0e0e">IN-SHOT SAMPLES</text>
    <text x="826" y="382" class="mono" font-size="10.5" fill="#0e0e0e">EXPOSURE THEN SHARP</text>
    <text x="826" y="402" class="mono" font-size="10.5" fill="#0e0e0e">NONE PASS: SHARPEST</text>
    <text x="826" y="444" class="mono" font-size="11" fill="#0e0e0e">OPENCV</text>
  </g>

  <g aria-label="5단계 사용자 검토와 출력">
    <rect x="1086" y="166" width="266" height="304" rx="16" fill="#05ff00"/>
    <text x="1110" y="200" class="mono" font-size="12" fill="#0e0e0e">05 / REVIEW</text>
    <text x="1110" y="254" class="heading" font-size="28" fill="#0e0e0e">REVIEW</text>
    <text x="1110" y="288" class="heading" font-size="28" fill="#0e0e0e">&amp; EXPORT</text>
    <path d="M1110 316H1328" stroke="#0e0e0e" stroke-width="2"/>
    <text x="1110" y="350" class="body" font-size="14" fill="#0e0e0e">GALLERY + WARNINGS</text>
    <text x="1110" y="382" class="mono" font-size="10.5" fill="#0e0e0e">JPG + METADATA JSON</text>
    <text x="1110" y="402" class="mono" font-size="10.5" fill="#0e0e0e">OPTIONAL CLIPS + ZIP</text>
    <text x="1110" y="424" class="mono" font-size="10.5" fill="#0e0e0e">FAIL: REMOVE RUN DIR</text>
    <text x="1110" y="444" class="mono" font-size="10.5" fill="#0e0e0e">SUCCESS: CLEANUP 15M</text>
  </g>

  <line x1="399" y1="470" x2="399" y2="508" stroke="#0e0e0e" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="399" y1="508" x2="653" y2="508" stroke="#0e0e0e" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="653" cy="508" r="4" fill="#0e0e0e"/>
  <text x="526" y="534" class="mono" font-size="10.5" fill="#0e0e0e" text-anchor="middle">TRIM FALLBACK / STREAM COPY FAILS: H.264 ENCODE</text>

  <text x="48" y="564" class="mono" font-size="10" fill="#0e0e0e">BOUNDARIES / LOCAL MEDIA · MAX 30S · USER OPTIONS · TEMP OUTPUT</text>
  <text x="1352" y="564" class="mono" font-size="10" fill="#0e0e0e" text-anchor="end">GRADIO · FFMPEG · PYSCENEDETECT · OPENCV</text>
</svg>
