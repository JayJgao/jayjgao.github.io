<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
  <title id="title">Boundary Deduper 처리 흐름</title>
  <desc id="desc">순서가 정해진 MP4를 검증하고 시작 프리즈와 경계 중복을 분석한 뒤, 불확실한 경우 값을 만들지 않고 사람이 모든 항목을 승인해야만 prefix trim과 출력 검증을 수행하는 다섯 단계 흐름</desc>
  <defs>
    <style>
      .display { font-family: Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: -1.8px; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .body { font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: -0.15px; }
      .mono { font-family: Menlo, Monaco, monospace; font-weight: 700; letter-spacing: 0.7px; }
    </style>
  </defs>

  <rect width="1400" height="580" fill="#f4e9e1"/>

  <text x="48" y="38" class="mono" font-size="13" fill="#0e0e0e">BOUNDARY DEDUPER / REVIEW-GATED PIPELINE</text>
  <text x="48" y="112" class="display" font-size="52" fill="#0e0e0e">RAW BOUNDARIES</text>
  <line x1="540" y1="92" x2="628" y2="92" stroke="#ff3d00" stroke-width="5"/>
  <text x="684" y="112" class="display" font-size="52" fill="#ff3d00">REVIEWED CUTS</text>

  <line x1="260" y1="310" x2="276" y2="310" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="520" y1="310" x2="536" y2="310" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="792" y1="310" x2="808" y2="310" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="1056" y1="310" x2="1072" y2="310" stroke="#0e0e0e" stroke-width="3"/>

  <g aria-label="1단계 순서가 정해진 MP4 입력 검증">
    <rect x="48" y="166" width="208" height="282" rx="16" fill="#2835f8"/>
    <text x="72" y="202" class="mono" font-size="15" fill="#ffffff">01 / INPUT</text>
    <text x="72" y="252" class="heading" font-size="27" fill="#ffffff">INGEST</text>
    <text x="72" y="284" class="heading" font-size="27" fill="#ffffff">&amp; VALIDATE</text>
    <path d="M72 312 H232" stroke="#ffffff" stroke-width="2"/>
    <text x="72" y="346" class="body" font-size="13" fill="#ffffff">2–12 ORDERED MP4</text>
    <text x="72" y="370" class="body" font-size="13" fill="#ffffff">FFPROBE CONTRACTS</text>
    <text x="72" y="394" class="body" font-size="13" fill="#ffffff">CFR · H.264 / HEVC</text>
    <text x="72" y="422" class="mono" font-size="11" fill="#f4e9e1">INPUT CAPS LOCKED</text>
  </g>

  <g aria-label="2단계 시작 프리즈와 인접 경계 중복 분석">
    <rect x="280" y="166" width="236" height="282" rx="16" fill="#5900cc"/>
    <text x="304" y="202" class="mono" font-size="15" fill="#ffffff">02 / ANALYSIS</text>
    <text x="304" y="252" class="heading" font-size="27" fill="#ffffff">FREEZE</text>
    <text x="304" y="284" class="heading" font-size="27" fill="#ffffff">+ SEAM</text>
    <path d="M304 312 H492" stroke="#ffffff" stroke-width="2"/>
    <text x="304" y="346" class="body" font-size="13" fill="#ffffff">MAD / FFMPEG FALLBACK</text>
    <text x="304" y="370" class="body" font-size="13" fill="#ffffff">SEAM AFTER EFFECTIVE F</text>
    <text x="304" y="394" class="body" font-size="13" fill="#ffffff">LUMA + EDGE / K</text>
    <text x="304" y="422" class="mono" font-size="11" fill="#f4e9e1">F + K = TOTAL T</text>
  </g>

  <g aria-label="3단계 불확실한 분석을 적용하지 않는 안전 경계">
    <rect x="540" y="166" width="248" height="282" rx="16" fill="#ffff00"/>
    <text x="564" y="202" class="mono" font-size="15" fill="#0e0e0e">03 / SAFETY</text>
    <text x="564" y="252" class="heading" font-size="27" fill="#0e0e0e">ABSTAIN</text>
    <text x="564" y="284" class="heading" font-size="26" fill="#0e0e0e">WITH EVIDENCE</text>
    <path d="M564 312 H764" stroke="#0e0e0e" stroke-width="2"/>
    <text x="564" y="346" class="body" font-size="13" fill="#0e0e0e">AMBIGUOUS / NO GUESS</text>
    <text x="564" y="370" class="body" font-size="13" fill="#0e0e0e">SEARCH LIMIT / NO TRIM</text>
    <text x="564" y="394" class="body" font-size="13" fill="#0e0e0e">PAIR MISMATCH / SKIP</text>
    <text x="564" y="422" class="mono" font-size="11" fill="#0e0e0e">PREVIEW + REASONS</text>
  </g>

  <g aria-label="4단계 모든 제안에 대한 사용자 검토와 승인">
    <rect x="812" y="166" width="240" height="282" rx="16" fill="#ff3d00"/>
    <text x="836" y="202" class="mono" font-size="15" fill="#0e0e0e">04 / HUMAN</text>
    <text x="836" y="252" class="heading" font-size="27" fill="#0e0e0e">REVIEW</text>
    <text x="836" y="284" class="heading" font-size="27" fill="#0e0e0e">SKIP / APPLY</text>
    <path d="M836 312 H1028" stroke="#0e0e0e" stroke-width="2"/>
    <text x="836" y="346" class="body" font-size="13" fill="#0e0e0e">EVERY ITEM DECIDED</text>
    <text x="836" y="370" class="body" font-size="13" fill="#0e0e0e">REVIEWED PREFIX ONLY</text>
    <text x="836" y="394" class="body" font-size="13" fill="#0e0e0e">PLAN REVISION BOUND</text>
    <text x="836" y="422" class="mono" font-size="11" fill="#0e0e0e">NO AUTO APPLY</text>
  </g>

  <g aria-label="5단계 승인된 prefix 적용과 출력 검증">
    <rect x="1076" y="166" width="276" height="282" rx="16" fill="#05ff00"/>
    <text x="1100" y="202" class="mono" font-size="15" fill="#0e0e0e">05 / OUTPUT</text>
    <text x="1100" y="252" class="heading" font-size="27" fill="#0e0e0e">APPLY</text>
    <text x="1100" y="284" class="heading" font-size="27" fill="#0e0e0e">&amp; VERIFY</text>
    <path d="M1100 312 H1328" stroke="#0e0e0e" stroke-width="2"/>
    <text x="1100" y="346" class="body" font-size="13" fill="#0e0e0e">ORIGINALS IMMUTABLE</text>
    <text x="1100" y="370" class="body" font-size="13" fill="#0e0e0e">COPY OR H.264 / AAC</text>
    <text x="1100" y="394" class="body" font-size="13" fill="#0e0e0e">OUTPUT CHECKS REQUIRED</text>
    <text x="1100" y="422" class="mono" font-size="11" fill="#0e0e0e">MP4 · ZIP · JSON</text>
  </g>

  <rect x="48" y="472" width="1304" height="54" rx="16" fill="#0e0e0e"/>
  <text x="72" y="505" class="mono" font-size="13" fill="#f4e9e1">APPROVAL BOUNDARY</text>
  <text x="1328" y="505" class="body" font-size="15" fill="#f4e9e1" text-anchor="end">ALL DECISIONS SAVED BEFORE ONE BATCH APPLY</text>

  <text x="48" y="558" class="mono" font-size="11" fill="#0e0e0e">LOCAL MEDIA · DETERMINISTIC ANALYSIS · HUMAN DECISION</text>
  <text x="1352" y="558" class="mono" font-size="11" fill="#0e0e0e" text-anchor="end">FASTAPI · REACT · FFMPEG</text>
</svg>
