<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">IRO Matcher 처리 파이프라인</title>
  <desc id="desc">로컬 영상 클립에서 레퍼런스와 target을 정하고 프레임을 샘플링한 뒤 컬러 변환과 LUT를 생성한다. 사용자가 경고와 WebGL 미리보기를 검토하고 ready target을 MP4로 내보내며, target별 실패는 분리된다.</desc>
  <defs>
    <style>
      .display { font-family: Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: -1.8px; }
      .heading { font-family: Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .body { font-family: Helvetica, Arial, sans-serif; font-weight: 600; }
      .mono { font-family: Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#f4e9e1"/>

  <text x="48" y="38" class="mono" font-size="13" fill="#0e0e0e">IRO MATCHER / LOCAL COLOR PIPELINE</text>
  <text x="48" y="108" class="display" font-size="52" fill="#0e0e0e">MIXED CLIPS</text>
  <rect x="410" y="83" width="64" height="6" fill="#ff3d00"/>
  <path d="M474 76L492 86L474 96Z" fill="#ff3d00"/>
  <text x="526" y="108" class="display" font-size="52" fill="#ff3d00">REVIEWABLE MATCH</text>

  <g aria-label="원본과 보정 결과 비교 아이콘">
    <rect x="1272" y="34" width="78" height="46" rx="6" fill="#2835f8"/>
    <rect x="1362" y="34" width="22" height="46" rx="6" fill="#ff3d00"/>
  </g>

  <line x1="278" y1="327" x2="302" y2="327" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="512" y1="327" x2="536" y2="327" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="786" y1="327" x2="810" y2="327" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="1092" y1="327" x2="1116" y2="327" stroke="#0e0e0e" stroke-width="3"/>

  <g aria-label="1단계 로컬 클립 세트와 레퍼런스 선택">
    <rect x="48" y="194" width="230" height="266" rx="16" fill="#2835f8"/>
    <text x="72" y="226" class="mono" font-size="13" fill="#ffffff">01 / LOCAL</text>
    <text x="72" y="278" class="heading" font-size="28" fill="#ffffff">CLIP SET</text>
    <text x="72" y="312" class="heading" font-size="28" fill="#ffffff">+ SOURCE</text>
    <path d="M72 338H254" stroke="#ffffff" stroke-width="2"/>
    <text x="72" y="372" class="body" font-size="14" fill="#ffffff">SAMPLES / UPLOADS</text>
    <text x="72" y="408" class="mono" font-size="11" fill="#f4e9e1">1 REFERENCE</text>
    <text x="72" y="426" class="mono" font-size="11" fill="#f4e9e1">+ TARGET CLIPS</text>
  </g>

  <g aria-label="2단계 레퍼런스와 target 프레임 샘플링">
    <rect x="302" y="194" width="210" height="266" rx="16" fill="#5900cc"/>
    <text x="326" y="226" class="mono" font-size="13" fill="#ffffff">02 / FRAMES</text>
    <text x="326" y="278" class="heading" font-size="27" fill="#ffffff">SELECT</text>
    <text x="326" y="312" class="heading" font-size="27" fill="#ffffff">FRAME SET</text>
    <path d="M326 338H488" stroke="#ffffff" stroke-width="2"/>
    <text x="326" y="372" class="body" font-size="13" fill="#ffffff">SOURCE: CHOSEN / MID</text>
    <text x="326" y="402" class="mono" font-size="10" fill="#f4e9e1">TARGET: MIDPOINT</text>
    <text x="326" y="420" class="mono" font-size="10" fill="#f4e9e1">OR STABLE 5</text>
    <text x="326" y="438" class="mono" font-size="9" fill="#f4e9e1">AT 10/30/50/70/90%</text>
  </g>

  <g aria-label="3단계 컬러 변환과 큐브 LUT 생성">
    <rect x="536" y="194" width="250" height="266" rx="16" fill="#ff3d00"/>
    <text x="560" y="226" class="mono" font-size="13" fill="#0e0e0e">03 / LOCAL ENGINE</text>
    <text x="560" y="278" class="heading" font-size="28" fill="#0e0e0e">FIT + BUILD</text>
    <text x="560" y="312" class="heading" font-size="28" fill="#0e0e0e">.CUBE LUT</text>
    <path d="M560 338H762" stroke="#0e0e0e" stroke-width="2"/>
    <text x="560" y="372" class="body" font-size="14" fill="#0e0e0e">MKL / MVGD</text>
    <text x="560" y="402" class="mono" font-size="10" fill="#0e0e0e">STRENGTH</text>
    <text x="560" y="420" class="mono" font-size="10" fill="#0e0e0e">BLEND TO IDENTITY</text>
    <text x="560" y="438" class="mono" font-size="10" fill="#0e0e0e">17^3 / 33^3</text>
  </g>

  <g aria-label="4단계 사용자 미리보기와 품질 경고 검토">
    <rect x="810" y="194" width="282" height="266" rx="16" fill="#ffff00"/>
    <text x="834" y="226" class="mono" font-size="13" fill="#0e0e0e">04 / HUMAN GATE</text>
    <text x="834" y="278" class="heading" font-size="28" fill="#0e0e0e">PREVIEW</text>
    <text x="834" y="312" class="heading" font-size="28" fill="#0e0e0e">+ GUARDRAILS</text>
    <path d="M834 338H1068" stroke="#0e0e0e" stroke-width="2"/>
    <text x="834" y="372" class="body" font-size="14" fill="#0e0e0e">ORIGINAL / APPLIED</text>
    <text x="834" y="406" class="mono" font-size="10" fill="#0e0e0e">PALETTE · RISK CHIPS</text>
    <text x="834" y="424" class="mono" font-size="10" fill="#0e0e0e">ADJUST / RE-RUN</text>
  </g>

  <g aria-label="5단계 ready target별 영상 출력">
    <rect x="1116" y="194" width="236" height="266" rx="16" fill="#05ff00"/>
    <text x="1140" y="226" class="mono" font-size="13" fill="#0e0e0e">05 / OUTPUT</text>
    <text x="1140" y="278" class="heading" font-size="28" fill="#0e0e0e">EXPORT</text>
    <text x="1140" y="312" class="heading" font-size="28" fill="#0e0e0e">PER TARGET</text>
    <path d="M1140 338H1328" stroke="#0e0e0e" stroke-width="2"/>
    <text x="1140" y="372" class="body" font-size="14" fill="#0e0e0e">FFMPEG LUT3D</text>
    <text x="1140" y="406" class="mono" font-size="10" fill="#0e0e0e">MP4 + .CUBE</text>
    <text x="1140" y="424" class="mono" font-size="10" fill="#0e0e0e">FAILURES ISOLATED</text>
  </g>

  <path d="M951 460V504H407V472" fill="none" stroke="#0e0e0e" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="407" cy="472" r="4" fill="#0e0e0e"/>
  <text x="678" y="530" class="mono" font-size="11" fill="#0e0e0e" text-anchor="middle">WARNINGS INFORM — USER ADJUSTS STRENGTH OR RESELECTS THE SOURCE FRAME</text>

  <rect x="48" y="556" width="1304" height="40" rx="16" fill="#0e0e0e"/>
  <text x="72" y="581" class="mono" font-size="11" fill="#f4e9e1">BOUNDARIES / LOCAL MEDIA · HEURISTIC WARNINGS · HUMAN REVIEW</text>
  <text x="1328" y="581" class="mono" font-size="11" fill="#05ff00" text-anchor="end">TARGET FAILURES STAY ISOLATED</text>
</svg>
