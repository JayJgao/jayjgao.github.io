<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">Reframer 처리 파이프라인</title>
  <desc id="desc">가로 영상을 검증하고 샷으로 나눈 뒤 비용 확인, 대상 추적, 편집자 검토를 거쳐 승인된 9대16 세로 초안과 결정 기록을 만드는 흐름</desc>
  <defs>
    <style>
      .display { font-family: Helvetica; font-weight: 900; letter-spacing: -1.8px; }
      .heading { font-family: Helvetica; font-weight: 800; letter-spacing: -0.7px; }
      .body { font-family: Helvetica; font-weight: 600; }
      .mono { font-family: Menlo; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1400" height="540" fill="#f4e9e1"/>

  <text x="48" y="38" class="mono" font-size="13" fill="#0e0e0e">REFRAMER / SHOT-AWARE PIPELINE</text>
  <text x="48" y="108" class="display" font-size="54" fill="#0e0e0e">HORIZONTAL VIDEO</text>
  <line x1="566" y1="86" x2="620" y2="86" stroke="#ff3d00" stroke-width="5"/>
  <path d="M620 77L634 86L620 95Z" fill="#ff3d00"/>
  <text x="660" y="108" class="display" font-size="54" fill="#ff3d00">9:16 DRAFT</text>

  <g aria-label="가로 영상에서 세로 영상으로 변환">
    <rect x="1260" y="38" width="82" height="46" rx="6" fill="#2835f8"/>
    <rect x="1354" y="26" width="30" height="58" rx="6" fill="#ff3d00"/>
  </g>

  <line x1="272" y1="294" x2="288" y2="294" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="466" y1="294" x2="482" y2="294" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="710" y1="294" x2="726" y2="294" stroke="#0e0e0e" stroke-width="3"/>
  <line x1="1044" y1="294" x2="1060" y2="294" stroke="#0e0e0e" stroke-width="3"/>

  <g aria-label="1단계 입력 검증과 샷 분할">
    <rect x="48" y="166" width="220" height="256" rx="16" fill="#2835f8"/>
    <text x="72" y="198" class="mono" font-size="13" fill="#ffffff">01 / LOCAL</text>
    <text x="72" y="250" class="heading" font-size="28" fill="#ffffff">INGEST</text>
    <text x="72" y="284" class="heading" font-size="28" fill="#ffffff">&amp; SHOT PLAN</text>
    <path d="M72 310H244" stroke="#ffffff" stroke-width="2"/>
    <text x="72" y="342" class="body" font-size="14" fill="#ffffff">VALIDATE · CUT · PROXY</text>
    <text x="72" y="386" class="mono" font-size="11" fill="#f4e9e1">PYSCENEDETECT</text>
    <text x="72" y="404" class="mono" font-size="11" fill="#f4e9e1">FFMPEG</text>
  </g>

  <g aria-label="2단계 외부 분석 전 비용 확인">
    <rect x="292" y="166" width="170" height="256" rx="16" fill="#ff3d00"/>
    <text x="316" y="198" class="mono" font-size="13" fill="#0e0e0e">02 / GATE</text>
    <text x="316" y="250" class="heading" font-size="27" fill="#0e0e0e">COST</text>
    <text x="316" y="284" class="heading" font-size="27" fill="#0e0e0e">CONFIRM</text>
    <path d="M316 310H438" stroke="#0e0e0e" stroke-width="2"/>
    <text x="316" y="342" class="body" font-size="14" fill="#0e0e0e">ESTIMATE FIRST</text>
    <text x="316" y="386" class="mono" font-size="11" fill="#0e0e0e">BEFORE PAID</text>
    <text x="316" y="404" class="mono" font-size="11" fill="#0e0e0e">MODEL CALL</text>
  </g>

  <g aria-label="3단계 텍스트 프롬프트 기반 대상 추적">
    <rect x="486" y="166" width="220" height="256" rx="16" fill="#5900cc"/>
    <text x="510" y="198" class="mono" font-size="13" fill="#ffffff">03 / MODEL</text>
    <text x="510" y="250" class="heading" font-size="29" fill="#ffffff">TRACK</text>
    <text x="510" y="284" class="heading" font-size="29" fill="#ffffff">SUBJECT</text>
    <path d="M510 310H682" stroke="#ffffff" stroke-width="2"/>
    <text x="510" y="342" class="body" font-size="14" fill="#ffffff">PROMPT · MASK · CROP</text>
    <text x="510" y="386" class="mono" font-size="11" fill="#f4e9e1">SAM 3.1</text>
    <text x="510" y="404" class="mono" font-size="11" fill="#f4e9e1">VIA FAL.AI</text>
  </g>

  <g aria-label="4단계 편집자 검토와 샷별 결정">
    <rect x="730" y="166" width="310" height="256" rx="16" fill="#ffff00"/>
    <text x="754" y="198" class="mono" font-size="13" fill="#0e0e0e">04 / EDITOR</text>
    <text x="754" y="250" class="heading" font-size="29" fill="#0e0e0e">EDITOR</text>
    <text x="754" y="284" class="heading" font-size="29" fill="#0e0e0e">REVIEW &amp; PLAN</text>
    <path d="M754 310H1016" stroke="#0e0e0e" stroke-width="2"/>
    <text x="754" y="342" class="body" font-size="14" fill="#0e0e0e">RECOMMENDED · CENTER</text>
    <text x="754" y="364" class="body" font-size="14" fill="#0e0e0e">ANCHOR · CANDIDATE</text>
    <text x="754" y="404" class="mono" font-size="11" fill="#0e0e0e">SHOT-LEVEL APPROVAL</text>
  </g>

  <g aria-label="5단계 승인된 계획 렌더링과 결정 기록">
    <rect x="1064" y="166" width="288" height="256" rx="16" fill="#05ff00"/>
    <text x="1088" y="198" class="mono" font-size="13" fill="#0e0e0e">05 / OUTPUT</text>
    <text x="1088" y="250" class="heading" font-size="28" fill="#0e0e0e">RENDER</text>
    <text x="1088" y="284" class="heading" font-size="28" fill="#0e0e0e">+ DECISION LOG</text>
    <path d="M1088 310H1328" stroke="#0e0e0e" stroke-width="2"/>
    <text x="1088" y="342" class="body" font-size="14" fill="#0e0e0e">APPROVED PLAN ONLY</text>
    <text x="1088" y="386" class="mono" font-size="11" fill="#0e0e0e">9:16 MP4</text>
    <text x="1088" y="404" class="mono" font-size="11" fill="#0e0e0e">+ JSON RECORD</text>
  </g>

  <line x1="885" y1="422" x2="885" y2="462" stroke="#0e0e0e" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="885" y1="462" x2="596" y2="462" stroke="#0e0e0e" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="596" y1="462" x2="596" y2="434" stroke="#0e0e0e" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="596" cy="434" r="4" fill="#0e0e0e"/>
  <text x="740" y="488" class="mono" font-size="11" fill="#0e0e0e" text-anchor="middle">RE-ANALYZE ONLY THE SELECTED SHOT</text>

  <text x="48" y="516" class="mono" font-size="11" fill="#0e0e0e">BOUNDARIES / LOCAL MEDIA · PAID MODEL · HUMAN DECISION</text>
  <text x="1352" y="516" class="mono" font-size="11" fill="#0e0e0e" text-anchor="end">FASTAPI · REACT</text>
</svg>
